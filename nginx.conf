# Security headers are repeated inside EVERY location block on purpose.
#
# nginx's add_header does not merge across levels: a `location` that declares
# any add_header of its own silently DISCARDS every add_header inherited from
# `server`. The previous version put the security headers at server level and
# Cache-Control inside each location — so nginx dropped all of them and the
# live site shipped with no CSP, no X-Frame-Options and no HSTS at all.
# Verified against production before this fix: every header was absent.
#
# Do not "tidy" these into the server block unless every location's own
# add_header goes with them.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── config.js — runtime config, contains ONLY the project URL ───────────
    # Must never be cached: a stale copy would point the app at the wrong
    # backend after a migration, and an edge cache once served a pre-fix copy
    # containing the old service key for hours after it was removed.
    location = /config.js {
        add_header X-Frame-Options            "DENY"                                    always;
        add_header X-Content-Type-Options     "nosniff"                                 always;
        add_header Referrer-Policy            "no-referrer"                             always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains"     always;
        add_header Cache-Control              "no-store, must-revalidate"               always;
        try_files $uri =404;
    }

    # ── Hashed build assets — safe to cache forever ────────────────────────
    location /assets/ {
        add_header X-Frame-Options            "DENY"                                    always;
        add_header X-Content-Type-Options     "nosniff"                                 always;
        add_header Referrer-Policy            "no-referrer"                             always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains"     always;
        add_header Cache-Control              "public, max-age=31536000, immutable"     always;
        try_files $uri =404;
    }

    # ── App shell ──────────────────────────────────────────────────────────
    # This panel approves payouts and verifications — irreversible,
    # money-moving actions — so it must never be framable (clickjacking).
    location / {
        add_header X-Frame-Options            "DENY"                                    always;
        add_header X-Content-Type-Options     "nosniff"                                 always;
        add_header Referrer-Policy            "no-referrer"                             always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains"     always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        # 'unsafe-inline' on style-src is required by the runtime theming;
        # script-src stays same-origin so an injected inline <script> cannot run.
        #
        # media-src is REQUIRED and must be listed explicitly. Chat transcripts
        # replay video messages hosted on media.dangg.app; with no media-src the
        # browser falls back to default-src 'self' and blocks every one of them,
        # so video messages silently disappeared from transcripts.
        #
        # static.cloudflareinsights.com is injected by Cloudflare itself in
        # front of this origin; without it the console fills with CSP errors on
        # every page load and real violations get lost in the noise.
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https://media.dangg.app; connect-src 'self' https://dangg-db.welbuiltai.in https://static.cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cache-Control              "no-cache"                                always;
        try_files $uri $uri/ /index.html;
    }
}
