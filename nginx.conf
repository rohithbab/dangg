server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    # The admin panel approves payouts and verifications — irreversible,
    # money-moving actions — so it must never be framable (clickjacking) and
    # should not leak its URLs to third parties.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP. 'unsafe-inline' on style-src is required by the CSS-in-JS used for
    # runtime theming; scripts are restricted to same-origin, so an injected
    # inline <script> cannot execute. connect-src is limited to the Supabase
    # host the app actually talks to.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://dangg-db.welbuiltai.in; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # config.js holds only the project URL, but it must never be cached — a
    # stale copy would point the app at the wrong backend after a migration.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
